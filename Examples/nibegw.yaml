# NIBE F1155 -> Home Assistant gateway
# LilyGo T-CAN485 (ESP32 + RS485) acting as a MODBUS40 accessory.
#
# Before flashing, replace every value marked CHANGE ME.

esphome:
  name: nibegw
  comment: Nibegw

# Platform moved out of the esphome block in ESPHome 2022.x.
# Keep the framework explicit: newer ESPHome defaults ESP32 to esp-idf,
# and the elupus component is tested against arduino.
esp32:
  board: esp32dev
  framework:
    type: arduino

# General ESPHome setup
api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  baud_rate: 0 # Serial logging off. The USB console will show nothing --
               # this is expected. Use the ESPHome dashboard logs over WiFi.

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true # Required for hidden SSIDs
  power_save_mode: none # The device must not miss inbound UDP requests

  # A static IP is effectively mandatory: Home Assistant sends read/write
  # requests TO this device, so the address must never change.
  # Setting it here is more reliable than a DHCP reservation.
  manual_ip:
    static_ip: 192.168.1.50 # CHANGE ME -- this gateway's address
    gateway: 192.168.1.1 # CHANGE ME -- your router
    subnet: 255.255.255.0
    dns1: 192.168.1.1 # CHANGE ME -- usually the same as gateway

# Load nibe component
external_components:
  - source: github://elupus/esphome-nibe

# Set pins required for LilyGo T-CAN485 board
output:
  - platform: gpio
    id: ENABLE_PIN # Enable the chip
    pin:
      number: GPIO19
      inverted: true
  - platform: gpio
    id: SE_PIN # Enable autodirection
    pin:
      number: GPIO17
      inverted: true
  - platform: gpio
    id: ENABLE_5V_PIN # Enable 5V pin for RS485 chip
    pin:
      number: GPIO16
      inverted: true

# Configure uart that will be used
uart:
  rx_pin: GPIO21
  tx_pin: GPIO22
  baud_rate: 9600

# Configure NibeGW
nibegw:
  udp:
    # Where to send pump data. This is your HOME ASSISTANT ip, not this device's.
    target:
      - ip: 192.168.1.10 # CHANGE ME -- Home Assistant
        port: 9999 # The Nibe Home Assistant integration listens on 9999 by default

    # Accept requests only from these addresses. May be empty for no filter.
    source:
      - 192.168.1.10 # CHANGE ME -- Home Assistant

    # Optional port this device listens on for read requests. Defaults to 9999
    # read_port: 9999

    # Optional port this device listens on for write requests. Defaults to 10000
    # write_port: 10000

  acknowledge:
    - MODBUS40

  # Constant replies to certain requests can be made
  constants:
    - address: MODBUS40
      token: ACCESSORY
      data: [
            0x0A, # MODBUS version low
            0x00, # MODBUS version high
            0x01, # MODBUS address?
      ]

# Some helper functions to restart ESPHome from HA
button:
  - platform: restart
    name: Nibegw Restart
  - platform: safe_mode
    name: Nibegw Safe Mode Boot
